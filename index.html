<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>Daylight — a little more focus</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b25;
      --muted: #78827b;
      --line: #e8ebe5;
      --paper: #fff;
      --canvas: #f6f7f2;
      --green: #355d49;
      --green-soft: #eaf1eb;
      --orange: #e9a76e;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 87% 2%, rgba(231, 210, 170, .24), transparent 31rem),
        var(--canvas);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 38px 0 64px;
    }

    .topbar, .brand, .date, .section-heading, .task-row, .task-main, .task-actions, .progress-label {
      display: flex;
      align-items: center;
    }

    .topbar, .section-heading, .progress-label { justify-content: space-between; }
    .brand { gap: 10px; font-size: 15px; font-weight: 750; letter-spacing: -.3px; }

    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      color: white;
      background: var(--green);
      border-radius: 11px;
    }

    .date { gap: 8px; color: var(--muted); font-size: 13px; }
    .date svg { width: 16px; height: 16px; }

    .intro { padding: 62px 0 30px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 54px);
      font-weight: 400;
      letter-spacing: -1.7px;
      line-height: 1.08;
    }

    h1 span { color: var(--green); font-style: italic; }
    .subtitle { margin: 13px 0 0; color: var(--muted); font-size: 15px; }

    .card {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(32, 43, 37, .06);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(37, 50, 41, .055);
    }

    .card-top { padding: 26px 28px 22px; }
    .section-heading { gap: 16px; }
    h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
    .count { color: var(--muted); font-size: 12px; }

    .progress { margin-top: 21px; }
    .progress-label { margin-bottom: 9px; color: var(--muted); font-size: 11px; }
    .progress-label strong { color: var(--green); font-weight: 650; }
    .progress-track { height: 5px; overflow: hidden; background: #edf0eb; border-radius: 8px; }
    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--green);
      border-radius: inherit;
      transition: width .25s ease;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin-top: 23px;
    }

    .task-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      color: var(--ink);
      background: #fbfcfa;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .task-input::placeholder { color: #a0a9a2; }
    .task-input:focus { border-color: #9aaf9f; box-shadow: 0 0 0 3px rgba(53, 93, 73, .09); }

    .add-button {
      display: inline-flex;
      height: 46px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 16px;
      color: white;
      background: var(--green);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background .2s, transform .2s;
    }

    .add-button:hover { background: #294c39; }
    .add-button:active { transform: scale(.98); }
    .add-button svg { width: 16px; height: 16px; }

    .list-toolbar {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 28px;
      border-top: 1px solid var(--line);
    }

    .filters { display: flex; gap: 5px; }
    .filter-button, .clear-button {
      padding: 7px 10px;
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      transition: color .2s, background .2s;
    }

    .filter-button { color: var(--muted); }
    .filter-button:hover, .clear-button:hover { color: var(--green); background: #f4f7f3; }
    .filter-button[aria-pressed="true"] { color: var(--green); background: var(--green-soft); font-weight: 650; }
    .clear-button { color: var(--muted); white-space: nowrap; }

    .task-list { padding: 0 28px 8px; }
    .task-row {
      min-height: 60px;
      gap: 13px;
      border-top: 1px solid #f0f2ee;
      animation: arrive .22s ease both;
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .task-main { flex: 1; min-width: 0; gap: 12px; }

    .check-button {
      display: grid;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      place-items: center;
      padding: 0;
      background: white;
      border: 1.5px solid #cbd3cc;
      border-radius: 50%;
      cursor: pointer;
      transition: background .18s, border-color .18s, transform .18s;
    }

    .check-button:hover { border-color: var(--green); transform: scale(1.08); }
    .check-button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: white; }
    .check-button svg { width: 12px; height: 12px; }
    .task-title { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .task-row.is-done .task-title { color: #a0a8a2; text-decoration: line-through; }

    .task-actions { gap: 11px; }
    .task-tag { padding: 5px 8px; color: #68766d; background: #f3f5f1; border-radius: 6px; font-size: 10px; }
    .delete-button {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      padding: 0;
      color: #9aa39c;
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      opacity: 0;
      transition: opacity .18s, color .18s, background .18s;
    }

    .task-row:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: #a34a3f; background: #fbf0ee; }
    .delete-button svg { width: 16px; height: 16px; }

    .empty-state { padding: 31px 12px 34px; color: var(--muted); text-align: center; }
    .empty-icon { margin-bottom: 10px; color: #9aaf9f; font-size: 24px; }
    .empty-state p { margin: 0; font-size: 13px; }
    .empty-state p + p { margin-top: 5px; color: #9aa39c; font-size: 11px; }
    .storage-notice { min-height: 18px; margin: 11px 2px 0; color: #8a5c35; font-size: 12px; }
    .footer { margin-top: 19px; color: #9aa39c; font-size: 11px; text-align: center; }

    @media (max-width: 560px) {
      .page { width: min(100% - 28px, 440px); padding-top: 23px; }
      .intro { padding: 48px 0 24px; }
      .card-top { padding: 22px 18px 19px; }
      .list-toolbar { padding: 0 14px; }
      .task-list { padding: 0 18px 8px; }
      .task-row { gap: 8px; }
      .task-actions { gap: 5px; }
      .task-tag { display: none; }
      .delete-button { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" width="19" height="19">
            <path d="M12 3.5c-1.6 3.2-5.8 4.3-5.8 9.1a5.8 5.8 0 0 0 11.6 0c0-4.8-4.2-5.9-5.8-9.1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M9.3 14.4c.4 1.2 1.3 1.8 2.7 1.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        daylight
      </div>
      <div class="date">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <time id="today"></time>
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">A fresh start</p>
      <h1 id="page-title">Make room for<br><span>what matters.</span></h1>
      <p class="subtitle">A little progress adds up. What’s on your mind today?</p>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <div class="card-top">
        <div class="section-heading">
          <h2 id="list-heading">Today’s focus</h2>
          <span class="count" id="task-count"></span>
        </div>
        <div class="progress">
          <div class="progress-label">
            <span>Daily progress</span>
            <strong id="progress-text">0% complete</strong>
          </div>
          <div class="progress-track" id="progress-track" role="progressbar" aria-label="Daily progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <form class="add-form" id="add-form">
          <label for="task-input" hidden>Add a task</label>
          <input class="task-input" id="task-input" name="task" type="text" maxlength="120" placeholder="Add a task to your day..." autocomplete="off" required>
          <button class="add-button" type="submit">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Add task
          </button>
        </form>
      </div>

      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>

      <div class="task-list" id="task-list" aria-live="polite"></div>
    </section>
    <p class="storage-notice" id="storage-notice" role="status" aria-live="polite"></p>
    <footer class="footer">One thing at a time. You’re doing just fine.</footer>
  </main>

  <script>
    const STORAGE_KEY = "daylight-tasks";
    const starterTasks = [
      { id: "starter-1", title: "Take a few minutes to plan the day", done: true },
      { id: "starter-2", title: "Focus on one important thing", done: false },
      { id: "starter-3", title: "Step away for a little break", done: false }
    ];

    const list = document.querySelector("#task-list");
    const form = document.querySelector("#add-form");
    const input = document.querySelector("#task-input");
    const notice = document.querySelector("#storage-notice");
    const filterButtons = [...document.querySelectorAll(".filter-button")];
    let activeFilter = "all";
    let tasks = readTasks();

    function readTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) return starterTasks.map(task => ({ ...task }));
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.every(task =>
          task && typeof task.id === "string" && typeof task.title === "string" && typeof task.done === "boolean"
        )) return parsed;
        throw new Error("Saved task data has an invalid format.");
      } catch (error) {
        notice.textContent = "Saved tasks couldn’t be loaded. Your changes will be kept for this visit.";
        return starterTasks.map(task => ({ ...task }));
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        notice.textContent = "Your browser couldn’t save changes. Tasks will be kept for this visit.";
      }
    }

    function render() {
      const completed = tasks.filter(task => task.done).length;
      const percentage = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
      document.querySelector("#task-count").textContent =
        `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
      document.querySelector("#progress-text").textContent = `${percentage}% complete`;
      document.querySelector("#progress-track").setAttribute("aria-valuenow", percentage);
      document.querySelector("#progress-fill").style.width = `${percentage}%`;

      const visibleTasks = tasks.filter(task =>
        activeFilter === "all" ||
        (activeFilter === "active" && !task.done) ||
        (activeFilter === "done" && task.done)
      );

      if (!visibleTasks.length) {
        const isEmpty = tasks.length === 0;
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon" aria-hidden="true">${isEmpty ? "✳" : "✓"}</div>
            <p>${isEmpty ? "A clear day starts here." : "Nothing in this list."}</p>
            <p>${isEmpty ? "Add a task above whenever you’re ready." : "Try another filter to see your tasks."}</p>
          </div>`;
        return;
      }

      list.innerHTML = visibleTasks.map(task => `
        <div class="task-row${task.done ? " is-done" : ""}">
          <div class="task-main">
            <button class="check-button" type="button" data-action="toggle" data-id="${escapeAttribute(task.id)}" aria-label="${task.done ? "Mark as to do" : "Mark as done"}: ${escapeAttribute(task.title)}" aria-pressed="${task.done}">
              ${task.done ? '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8 3 3 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ""}
            </button>
            <span class="task-title">${escapeHtml(task.title)}</span>
          </div>
          <div class="task-actions">
            <span class="task-tag">${task.done ? "Complete" : "Today"}</span>
            <button class="delete-button" type="button" data-action="delete" data-id="${escapeAttribute(task.id)}" aria-label="Delete: ${escapeAttribute(task.title)}">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 7h15M10 11v6m4-6v6M6.5 7l.8 13h9.4l.8-13M9 7V4h6v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>`).join("");
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) {
        input.focus();
        return;
      }
      tasks.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, title, done: false });
      input.value = "";
      activeFilter = "all";
      filterButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));
      saveTasks();
      render();
      input.focus();
    });

    list.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const { action, id } = button.dataset;
      if (action === "toggle") {
        tasks = tasks.map(task => task.id === id ? { ...task, done: !task.done } : task);
      } else if (action === "delete") {
        tasks = tasks.filter(task => task.id !== id);
      }
      saveTasks();
      render();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filterButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        render();
      });
    });

    document.querySelector("#clear-completed").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      render();
    });

    document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "short", month: "short", day: "numeric"
    }).format(new Date());
    render();
  </script>
</body>
</html>
